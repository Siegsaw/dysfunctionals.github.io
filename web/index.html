<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PantryChef</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="index.css">
  <!-- Apply dark mode before paint to prevent flash -->
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
</head>
<body>

<header>
  <div class="logo" onclick="location.href='index.html'">PantryChef</div>
  <nav class="h-nav">
    <button class="nav-btn active">Home</button>
    <button class="nav-btn" onclick="location.href='inventory.html'">Inventory</button>
  </nav>
  <div class="h-right">
    <span id="userBadge"></span>
    <button class="btn-theme" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    <button class="btn-signin" id="btnSignIn" onclick="location.href='login.html'">Sign In</button>
    <button class="btn-logout" id="btnLogout" onclick="doLogout()">Sign Out</button>
  </div>
</header>

<div class="toast" id="toast"></div>

<div class="page">
  <div class="page-title">Search Recipes</div>
  <div class="page-sub">Add ingredients to find matching recipes.</div>

  <div class="input-card">
    <div class="input-row">
      <div class="af-wrap">
        <input id="ingName" type="text" placeholder="Ingredient name…" autocomplete="off">
        <div id="suggestions"></div>
      </div>
      <input id="ingQty" class="qty-inp" type="number" placeholder="Qty" min="0.01" step="any">
      <select id="ingUnit" class="unit-sel">
        <option>g</option><option>kg</option><option>ml</option><option>L</option>
        <option>cups</option><option>tbsp</option><option>tsp</option>
        <option selected>pcs</option><option>oz</option><option>lb</option>
      </select>
      <button class="btn-add-ing" onclick="addIng()" title="Add">+</button>
      <button class="btn-clear-ing" onclick="clearForm()" title="Clear">✕</button>
    </div>

    <button class="common-toggle" id="commonToggle" onclick="toggleCommon()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Common ingredients
    </button>
    <div class="common-grid" id="commonGrid"></div>

    <div class="ing-chips-section" id="chipsSection" style="display:none">
      <div class="ing-chips-label" id="chipsLabel">YOUR INGREDIENTS (0)</div>
      <div class="ing-chips" id="chipsList"></div>
    </div>
  </div>

  <div class="results-section" id="resultsSection" style="display:none">
    <div class="results-label" id="resultsLabel"></div>
    <div class="results-grid" id="resultsGrid"></div>
  </div>
  <div class="results-empty" id="resultsEmpty">
    <span class="results-empty-ico">🍳</span>
    <p>Add ingredients above to find matching recipes.</p>
  </div>
</div>

<script src="shared.js"></script>
<script src="index.js"></script>
</body>
</html>
